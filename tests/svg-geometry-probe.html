<div class="probe"><div class="lbl">figa-lsb</div><svg class="fig" viewBox="-14 -14 848 368" role="img" aria-labelledby="figa-title figa-desc" preserveAspectRatio="xMidYMid meet">
  <title id="figa-title">插图 最低有效位（LSB）在 JPEG 重编码下失效</title>
  <desc id="figa-desc">把 262144 个比特写入图像最低位后经 JPEG 重编码读回，质量 95、90、75 三档的正确率分别为 49.89%、49.95%、50.08%，均等于随机猜测；同一条件下本方法的 DCT 差分调制在质量 75 读到 99.48%，而固定裕量取 2 时只有 71.88%。</desc>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7dd3fc">
    <text x="8" y="26" font-size="12.5">最低有效位写入 → JPEG 重编码 → 读回正确率（262144 比特，照片载体）</text>
    <text x="8" y="58" font-size="11.5" fill="#97a3b6">原像素　178 = 1 0 1 1 0 0 1 0</text>
    <text x="8" y="78" font-size="11.5" fill="#97a3b6">写 1 →　179 = 1 0 1 1 0 0 1 1　　改动幅度仅 1 个灰度级</text>
    <text x="8" y="98" font-size="11.5" fill="#fbbf24">但 JPEG 逆变换的取整误差同样是 ±1 个灰度级 → 最低位被整体覆盖</text>
    <text x="8" y="130" font-size="12" fill="#97a3b6">LSB 写入后按不同质量读回</text>
    <line x1="110" y1="150" x2="110" y2="240" stroke="#7dd3fc" stroke-opacity="0.4"/>
    <line x1="260" y1="150" x2="260" y2="240" stroke="#7dd3fc" stroke-opacity="0.25" stroke-dasharray="4 3"/>
    <text x="264" y="146" font-size="10.5" fill="#fbbf24">50% = 随机猜测</text>
    <rect x="110" y="158" width="150" height="14" rx="3" fill="#7dd3fc" fill-opacity="0.3" stroke="#7dd3fc"/>
    <text x="102" y="170" text-anchor="end" font-size="11" fill="#97a3b6">q=95</text>
    <text x="268" y="170" font-size="11" fill="#7dd3fc">49.89%</text>
    <rect x="110" y="184" width="150" height="14" rx="3" fill="#7dd3fc" fill-opacity="0.3" stroke="#7dd3fc"/>
    <text x="102" y="196" text-anchor="end" font-size="11" fill="#97a3b6">q=90</text>
    <text x="268" y="196" font-size="11" fill="#7dd3fc">49.95%</text>
    <rect x="110" y="210" width="150" height="14" rx="3" fill="#7dd3fc" fill-opacity="0.3" stroke="#7dd3fc"/>
    <text x="102" y="222" text-anchor="end" font-size="11" fill="#97a3b6">q=75</text>
    <text x="268" y="222" font-size="11" fill="#7dd3fc">50.08%</text>
    <rect x="110" y="236" width="298" height="14" rx="3" fill="#fbbf24" fill-opacity="0.45" stroke="#fbbf24"/>
    <text x="102" y="248" text-anchor="end" font-size="11" fill="#97a3b6">本方法 q=75</text>
    <text x="416" y="248" font-size="11" fill="#fbbf24">99.48%</text>
    <line x1="0" y1="258" x2="820" y2="258" stroke="#7dd3fc" stroke-opacity="0.2"/>
    <text x="8" y="282" font-size="12" fill="#97a3b6">对照 · 本方法（DCT 差分调制，一个 64×64 区块承载 384 比特）</text>
    <text x="8" y="304" font-size="11.5" fill="#fbbf24">自适应裕量 q=75 正确率 99.48%；同一条件下固定裕量取 2 只有 71.88%</text>
    <text x="8" y="326" font-size="11.5" fill="#97a3b6">结论：提高压缩质量救不回最低位，像素域不存在抗量化的承载位置。</text>
  </g>
</svg></div>
<div class="probe"><div class="lbl">fig1-architecture</div><svg class="fig" viewBox="-14 -14 1088 428" role="img" aria-labelledby="fig1-title fig1-desc" preserveAspectRatio="xMidYMid meet">

    <text x="307" y="178" text-anchor="middle" fill="#97a3b6" font-size="11.5">14 字节头 + 48 字节载荷 + K/N</text>
    <rect x="450" y="44" width="120" height="44" rx="8" fill="none" stroke="#7dd3fc"/>

    <rect x="750" y="44" width="290" height="260" rx="10" fill="none" stroke="#7dd3fc" stroke-opacity="0.65"/>
    <text x="895" y="63" text-anchor="middle" fill="#97a3b6" font-size="12">提取端</text>

    <text x="764" y="104" font-size="11">② 相位 8 px 步长枚举 63 个原点</text>
    <text x="764" y="122" font-size="11">③ 尺度 导频量倍率 → α/z 双判据</text>
    <text x="764" y="140" font-size="11">→ 重采样回原尺寸 → 干扰对消 → 再提取</text>
    <text x="764" y="158" font-size="11">④ 失败 返回 debugMask 与两条路径读数</text>

<div class="probe"><div class="lbl">fig2-dct-modulation</div><svg class="fig" viewBox="-14 -14 928 368" role="img" aria-labelledby="fig2-title fig2-desc" preserveAspectRatio="xMidYMid meet">

    <rect x="149" y="89" width="30" height="30" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="164" y="108" text-anchor="middle" font-size="10.5" fill="#fbbf24">1,4</text>
    <rect x="117" y="121" width="30" height="30" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/>

    <text x="310" y="86" font-size="12.5" fill="#fbbf24">比特 = 一对系数的大小关系（a, b 为配对系数）</text>

<div class="probe"><div class="lbl">fig3-redundancy</div><svg class="fig" viewBox="-14 -14 788 348" role="img" aria-labelledby="fig3-title fig3-desc" preserveAspectRatio="xMidYMid meet">

  <desc id="fig3-desc">K 个源符号经 GF(2^16) 系统化 Reed-Solomon 编码成为 N 等于 2K 个符号，前 K 个即原始分片；任意收到不少于 K 个符号即可解码，因此理论边界为可容忍 50% 符号丢失，而面积遮挡下的实测稳定区间只有 25% 至 35%。</desc>

    <text x="197" y="174" text-anchor="middle" font-size="11" fill="#0f1319">3</text>
    <rect x="218" y="154" width="42" height="30" fill="#7dd3fc" fill-opacity="0.35" stroke="#7dd3fc"/>
    <text x="239" y="174" text-anchor="middle" font-size="11" fill="#0f1319">…</text>

    <text x="365" y="174" text-anchor="middle" font-size="11" fill="#7dd3fc">…</text>
    <rect x="386" y="154" width="42" height="30" fill="none" fill-opacity="1" stroke="#7dd3fc"/>
    <text x="407" y="174" text-anchor="middle" font-size="11" fill="#7dd3fc">N</text>
    <text x="470" y="168" font-size="12" fill="#fbbf24">系统化：前 K 份 = 原始分片</text>
    <text x="470" y="188" font-size="12" fill="#fbbf24">任意收到 ≥ K 份即可解码</text>
    <line x1="40" y1="218" x2="720" y2="218" stroke="#7dd3fc" stroke-opacity="0.25"/>

<script>
(function () {
  'use strict';
  var NAMES = ["figa-lsb","fig1-architecture","fig2-dct-modulation","fig3-redundancy","fig4-quadrant","fig5-pilot","figb-phase-search","fig6-test-results","figc-hamming","figd-tradeoff"];
  var out = { checkWidth: 1280, tool: 'svg-geometry.node.js', figures: [], problems: [] };
  var figs = document.querySelectorAll('svg.fig');
  for (var fi = 0; fi < figs.length; fi++) {
    var svg = figs[fi];
    var name = NAMES[fi] || ('fig' + fi);
    var vb = svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    var vx = vb[0], vy = vb[1], vw = vb[2], vh = vb[3];
    var sr = svg.getBoundingClientRect();
    var scale = sr.width / vw;
    function toU(r) {
      return { x: (r.left - sr.left) / scale + vx, y: (r.top - sr.top) / scale + vy,
               w: r.width / scale, h: r.height / scale,
               x2: (r.right - sr.left) / scale + vx, y2: (r.bottom - sr.top) / scale + vy };
    }
    var f = { name: name, viewBox: [vx, vy, vw, vh], renderWidth: Math.round(sr.width),
              renderHeight: Math.round(sr.height), texts: [], rects: [], others: [] };
    var nodes = svg.querySelectorAll('rect, text, line, path, circle, polyline, polygon, ellipse');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') continue;
      var r;
      try { r = el.getBoundingClientRect(); } catch (e) { continue; }
      if (!r.width && !r.height) continue;
      var u = toU(r);
      var tag = el.tagName.toLowerCase();
      var rec = { tag: tag, x: +u.x.toFixed(1), y: +u.y.toFixed(1), w: +u.w.toFixed(1), h: +u.h.toFixed(1),
                  x2: +u.x2.toFixed(1), y2: +u.y2.toFixed(1),
                  text: tag === 'text' ? (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40) : undefined,
                  fontSize: tag === 'text' ? +parseFloat(cs.fontSize).toFixed(2) : undefined };
      if (tag === 'text') f.texts.push(rec); else if (tag === 'rect') f.rects.push(rec); else f.others.push(rec);
      if (u.x < vx - 0.5 || u.y < vy - 0.5 || u.x2 > vx + vw + 0.5 || u.y2 > vy + vh + 0.5) {
        out.problems.push({ fig: name, kind: '越界', detail: tag + ' ' + (rec.text || '') +
          ' 超出 viewBox（元素 ' + rec.x + ',' + rec.y + ' → ' + rec.x2 + ',' + rec.y2 + '）' });
      }
      var margin = Math.min(u.x - vx, u.y - vy, (vx + vw) - u.x2, (vy + vh) - u.y2);
      if (margin < 10 && margin > -0.5) {
        out.problems.push({ fig: name, kind: '边距过紧', detail: tag + ' ' + (rec.text || '') +
          ' 距 viewBox 边界仅 ' + margin.toFixed(1) + 'px' });
      }
      if (tag === 'text' && rec.fontSize < 10) {
        out.problems.push({ fig: name, kind: '字号过小', detail: '"' + rec.text + '" 字号 ' + rec.fontSize });
      }
    }
    for (var ti = 0; ti < f.texts.length; ti++) {
      var t = f.texts[ti];
      var cx = (t.x + t.x2) / 2, cy = (t.y + t.y2) / 2;
      for (var ri = 0; ri < f.rects.length; ri++) {
        var rr = f.rects[ri];
        if (rr.w < 40 || rr.h < 20) continue;
        if (cx >= rr.x && cx <= rr.x2 && cy >= rr.y && cy <= rr.y2) {
          var sl = t.x - rr.x, sr2 = rr.x2 - t.x2, st = t.y - rr.y, sb = rr.y2 - t.y2;
          if (sl < -1 || sr2 < -1 || st < -1 || sb < -1) {
            out.problems.push({ fig: name, kind: '文字溢出容器', detail: '"' + t.text + '" 容器=[' +
              rr.x + ',' + rr.y + ' ' + rr.w + '×' + rr.h + '] 文字=[' + t.x + ',' + t.y + ' ' + t.w + '×' + t.h +
              '] 左/右/上/下余量=' + sl.toFixed(1) + '/' + sr2.toFixed(1) + '/' + st.toFixed(1) + '/' + sb.toFixed(1) });
          }
          break;
        }
      }
    }
    for (var a = 0; a < f.texts.length; a++) {
      for (var b = a + 1; b < f.texts.length; b++) {
        var A = f.texts[a], B = f.texts[b];
        var ox = Math.min(A.x2, B.x2) - Math.max(A.x, B.x);
        var oy = Math.min(A.y2, B.y2) - Math.max(A.y, B.y);
        if (ox > 1 && oy > 1) {
          out.problems.push({ fig: name, kind: '文字重叠', detail: '"' + A.text + '" 与 "' + B.text +
            '" 相交 ' + ox.toFixed(1) + '×' + oy.toFixed(1) + 'px' });
        }
      }
    }
    out.figures.push(f);
  }
  var pre = document.createElement('pre');
  pre.id = 'svgMetrics';
  pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
  document.title = 'metrics-done';
})();
</script></body></html>
